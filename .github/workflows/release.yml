name: release

# Builds a signed APK and publishes it as a GitHub Release. Start it by
# pushing a tag like v0.2.0, or with "Run workflow" on GitHub (it then makes
# the tag on the commit it built). Actions are pinned to commits.
#
# Three jobs, so the slow work is done before you are asked (docs/releasing.md):
# - build: the release APK, unsigned, with the version in it. No secrets.
# - test: the unit tests, unless the build workflow already passed them on
#   this very commit (it runs on every push to main). Beside build.
# - publish: in the `release` environment, so it waits for your approval,
#   and only it can read the signing key. It signs the APK build made,
#   checks the signature and publishes: under a minute once approved.
#   A pushed tag alone never signs anything.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (becomes tag v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists. Pick a new version."
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' isn't vMAJOR.MINOR.PATCH with each part below 100 (e.g. v0.2.0, v1.0.0-rc.1)."
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-37.2 platform-tools"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # No YGG_KEYSTORE_FILE here: the release build is left unsigned (app/build.gradle.kts).
      - name: Build the release APK, unsigned
        env:
          YGG_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew :app:assembleRelease --console=plain

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # The build workflow tests every push to main; a release of a commit it
      # already passed need not wait for the same tests again.
      - name: Passed already on this commit?
        id: passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count' || echo 0)
          if [ "${runs:-0}" -gt 0 ]; then
            echo "The build workflow passed $GITHUB_SHA: its tests stand for this release."
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.passed.outputs.yes != 'true'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.passed.outputs.yes != 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        if: steps.passed.outputs.yes != 'true'
        with:
          packages: "platforms;android-37.2 platform-tools"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: steps.passed.outputs.yes != 'true'
      - name: Test
        if: steps.passed.outputs.yes != 'true'
        run: |
          python3 bridge/test_ygg_bridge.py
          ./gradlew :app:testDebugUnitTest --console=plain

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    # One release published at a time; builds of the next one need not wait.
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      BUILD_TOOLS: 36.0.0
    steps:
      - name: Check the signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.YGG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YGG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YGG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YGG_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=(YGG_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(YGG_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(YGG_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(YGG_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets in the release environment: ${missing[*]}. See docs/releasing.md."
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-unsigned

      - name: Sign, check and name the APK
        id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.YGG_KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          YGG_KEYSTORE_PASSWORD: ${{ secrets.YGG_KEYSTORE_PASSWORD }}
          YGG_KEY_ALIAS: ${{ secrets.YGG_KEY_ALIAS }}
          YGG_KEY_PASSWORD: ${{ secrets.YGG_KEY_PASSWORD }}
          NAME: ${{ needs.build.outputs.name }}
        run: |
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          [ -x "$tools/apksigner" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$BUILD_TOOLS" >/dev/null
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          in=app-release-unsigned.apk
          # Gradle aligns what it packs; align again only if it somehow did not.
          if ! "$tools/zipalign" -c 4 "$in"; then
            "$tools/zipalign" -f 4 "$in" aligned.apk && in=aligned.apk
          fi
          out="yggdrasil-$NAME.apk"
          "$tools/apksigner" sign --ks "$KEYSTORE_FILE" --ks-pass env:YGG_KEYSTORE_PASSWORD \
            --ks-key-alias "$YGG_KEY_ALIAS" --key-pass env:YGG_KEY_PASSWORD --out "$out" "$in"
          "$tools/apksigner" verify --print-certs "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          NAME: ${{ needs.build.outputs.name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --generate-notes --title "Yggdrasil $NAME")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # On a manual run the tag doesn't exist yet: --target makes it on the commit built here.
          gh release create "$TAG" --target "$GITHUB_SHA" "${flags[@]}" "$FILE" "$FILE.sha256"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
