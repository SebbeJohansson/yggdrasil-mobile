name: release

# Builds a signed APK and publishes it as a GitHub Release. Start it by
# pushing a tag like v0.2.0, or with "Run workflow" on GitHub (it then makes
# the tag on the commit it built). Needs the signing secrets in docs/releasing.md,
# kept in the `release` environment: each run waits for you to approve it there,
# so a pushed tag alone never signs anything. Actions are pinned to commits.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (becomes tag v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists. Pick a new version."
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' isn't vMAJOR.MINOR.PATCH with each part below 100 (e.g. v0.2.0, v1.0.0-rc.1)."
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Check the signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.YGG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YGG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YGG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YGG_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=(YGG_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(YGG_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(YGG_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(YGG_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets in the release environment: ${missing[*]}. See docs/releasing.md."
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-37.2 platform-tools build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # Tests first, without the keystore; it is written only for the build
      # that signs, and gone when that step ends.
      - name: Test
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build the signed release APK
        env:
          YGG_VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_BASE64: ${{ secrets.YGG_KEYSTORE_BASE64 }}
          YGG_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          YGG_KEYSTORE_PASSWORD: ${{ secrets.YGG_KEYSTORE_PASSWORD }}
          YGG_KEY_ALIAS: ${{ secrets.YGG_KEY_ALIAS }}
          YGG_KEY_PASSWORD: ${{ secrets.YGG_KEY_PASSWORD }}
        run: |
          trap 'rm -f "$YGG_KEYSTORE_FILE"' EXIT
          echo "$KEYSTORE_BASE64" | base64 --decode > "$YGG_KEYSTORE_FILE"
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Check the signature and name the APK
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          out="yggdrasil-${{ steps.version.outputs.name }}.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --title "Yggdrasil ${{ steps.version.outputs.name }}")
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          # On a manual run the tag doesn't exist yet: --target makes it on the commit built here.
          gh release create "${{ steps.version.outputs.tag }}" --target "$GITHUB_SHA" "${flags[@]}" \
            "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
