name: heimdall

# The security watchman (.github/heimdall/heimdall.py): dependencies with
# known vulnerabilities, keys committed by mistake, and the app's own
# security settings. Findings go into one issue labelled heimdall, which the
# app reads and turns into alerts. Nightly, by hand, and when dependencies change.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gradle/libs.versions.toml"
      - "**/build.gradle.kts"
      - ".github/heimdall/**"
      - ".github/workflows/heimdall.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: heimdall
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks reads every commit

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-37.2 platform-tools"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The pinned scanners' dependencies build with the Go of their time, not the newest.
          go-version: "1.23"
          cache: false

      - name: Install the scanners (pinned)
        run: |
          go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.0
          go install github.com/zricethezav/gitleaks/v8@v8.18.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lock the app's dependencies (for this run only)
        # The build keeps no lockfile; an init script turns locking on here
        # so OSV can read exactly what the APK ships.
        run: |
          cat > "$RUNNER_TEMP/lock.gradle" <<'EOF'
          allprojects { dependencyLocking { lockAllConfigurations() } }
          EOF
          # Only what the release APK ships: resolving one configuration writes only its locks,
          # leaving out the build's own tools (the Android plugin, lint, tests).
          ./gradlew --init-script "$RUNNER_TEMP/lock.gradle" :app:dependencies --configuration releaseRuntimeClasspath --write-locks --console=plain -q > /dev/null
          grep -c "releaseRuntimeClasspath" app/gradle.lockfile

      - name: Dependencies with known vulnerabilities
        run: osv-scanner --lockfile=app/gradle.lockfile --format json --output osv.json || true

      - name: Keys in any commit
        run: gitleaks detect --source . --redact --report-format json --report-path gitleaks.json --exit-code 0

      - name: Collect
        run: python3 .github/heimdall/heimdall.py collect

      - name: Report to the heimdall issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/heimdall/heimdall.py report
